[general]
watch_paths = ["~/Downloads"]

[[rules]]
name = "Documents"
match_extension = ["pdf", "docx", "txt"]
destination = "Documents"
action = "move"

[[rules]]
name = "Images"
match_extension = ["jpg", "jpeg", "png", "webp"]
destination = "Images"
action = "move"

[[rules]]
name = "Others"
match_extension = ["mp3", "zip", "py"]
destination = "Others"
action = "move"
